services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caneco_user
      POSTGRES_PASSWORD: caneco_pass
      POSTGRES_DB: caneco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caneco_user -d caneco_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg://caneco_user:caneco_pass@postgres:5432/caneco_db
      JWT_SECRET_KEY: dev_jwt_secret_key_veao2026_remplacer_en_production_64chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: '["http://localhost:5173"]'
      # URL publique (tunnel ngrok) encodee dans les QR codes des fiches
      # tableaux, pour que le scan fonctionne depuis un telephone.
      PUBLIC_BASE_URL: "https://blazing-hanky-icy.ngrok-free.dev"
      ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
